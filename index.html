<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Native Pulse</title><style>
:root{--ink:#172033;--muted:#5f6b7d;--violet:#5b4fe9;--line:#dce3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 9% 7%,#ddecff 0 10%,transparent 30%),radial-gradient(circle at 93% 16%,#fff0be 0 8%,transparent 25%),#f7f9fd}.shell{width:min(920px,calc(100% - 32px));margin:auto;padding:48px 0 72px}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--violet)}h1{font-size:clamp(2.35rem,6vw,4.6rem);line-height:1.02;letter-spacing:-.065em;margin:10px 0}h1 em{font-style:normal;color:var(--violet)}.intro,.small-copy{font-size:1.1rem;line-height:1.55;color:var(--muted);max-width:650px}.card{background:#fffffff0;border:1px solid var(--line);border-radius:28px;padding:clamp(22px,4vw,38px);box-shadow:0 18px 55px #2f45691a}.guide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.guide{padding:0 0 17px;border:2px solid var(--line);border-radius:20px;background:#fff;color:var(--ink);text-align:left;cursor:pointer;overflow:hidden}.guide:hover,.guide:focus-visible{transform:translateY(-4px);border-color:var(--violet);box-shadow:0 12px 28px #5b4fe929;outline:none}.guide img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.guide strong,.guide span{display:block;margin:12px 14px 0}.guide span{font-size:.86rem;color:var(--muted);line-height:1.35;margin-top:4px}.quiz-top{display:flex;justify-content:space-between;gap:14px;font-size:.84rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.guide-chip{letter-spacing:0;text-transform:none;color:var(--violet);background:#eeedff;padding:7px 10px;border-radius:99px}.bar{height:9px;background:#e8edf5;border-radius:99px;margin:16px 0 28px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5b4fe9,#6d9cff);transition:width .25s}.question{font-size:clamp(1.45rem,3.2vw,2.05rem);line-height:1.2;letter-spacing:-.035em}.options{display:grid;gap:12px}.option{display:flex;align-items:center;gap:15px;width:100%;padding:17px;border:1px solid var(--line);border-radius:16px;background:#f9fbfe;color:var(--ink);text-align:left;font:inherit;font-size:1rem;cursor:pointer}.option:hover{background:#f0efff;border-color:#9a92f5}.letter{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:50%;background:#dfeafe;color:#285ec3;font-weight:800}.result{text-align:center}.result img{width:min(270px,80%);aspect-ratio:1;object-fit:cover;border-radius:24px;border:5px solid #fff;box-shadow:0 14px 34px #31405e2e}.result h2{font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.06em;margin:16px 0 8px}.result p{max-width:620px;margin:0 auto 22px;line-height:1.6;color:var(--muted);white-space:pre-line;text-align:left}.score{display:inline-block;border-radius:99px;background:#fff2c9;color:#7b5500;font-weight:800;padding:8px 13px;margin-bottom:14px}.action{padding:12px 16px;border:1px solid var(--violet);border-radius:12px;background:var(--violet);color:#fff;font:inherit;font-weight:800;cursor:pointer}.restart{display:block;margin:18px auto 0;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}.hidden{display:none!important}@media(max-width:650px){.shell{width:min(100% - 22px,920px);padding-top:30px}.guide-grid{gap:9px}.guide{border-radius:15px}.guide strong,.guide span{margin-left:9px;margin-right:9px}.guide strong{font-size:.9rem}.guide span{font-size:.75rem}.card{border-radius:22px}.quiz-top{font-size:.7rem}}
</style></head><body><main class="shell"><p class="eyebrow">AI Native Pulse · 10 questions</p><h1>Are you ready to be <em>AI native?</em></h1><p class="intro">There is no right answer—just a quick read on where your workflow is today and how you bring AI into it.</p><section id="guide-screen" class="card"><h2>Choose your quiz guide</h2><p class="small-copy">Pick the character you want beside you for the ride. This is your choice—not a guess about you.</p><div class="guide-grid"><button class="guide" data-guide="Female explorer"><img src="avatar-female.png" alt="Female explorer"><strong>Female explorer</strong><span>Choose the character you want to play.</span></button><button class="guide" data-guide="Male explorer"><img src="avatar-male.png" alt="Male explorer"><strong>Male explorer</strong><span>Choose the character you want to play.</span></button><button class="guide" data-guide="Angel guide"><img src="avatar-angel.png" alt="Angel guide"><strong>Angel guide</strong><span>A bright, gender-free character choice.</span></button></div></section><section id="quiz-screen" class="card hidden"><div class="quiz-top"><span id="counter"></span><span id="guide-chip" class="guide-chip"></span></div><div class="bar"><i id="bar"></i></div><h2 id="question" class="question"></h2><div id="options" class="options"></div></section><section id="result-screen" class="card result hidden"><div id="score" class="score"></div><img id="result-image" alt="Your selected quiz guide"><h2 id="result-title"></h2><p id="result-copy"></p><button id="copy" class="action">Copy LinkedIn caption</button><button id="restart" class="restart">Take it again</button></section></main><script>
const questions=[["You need to write a substantial message or brief.",["I open a blank document and draft it line by line.","I draft it myself, then use AI to tighten or polish it.","I give AI my raw thoughts, audience, and goal; then shape the best draft."]],["You need to make a presentation.",["I start with layout boxes and build the deck manually.","I use templates or AI features for selected slides.","I give AI the audience, narrative, evidence, and visual brief; then refine the story."]],["A spreadsheet reveals a surprising trend.",["I work through formulas, filters, and cells myself.","I ask AI for a formula or a quick check.","I give AI the data and questions, ask it to find anomalies and test hypotheses."]],["You need to learn an unfamiliar topic.",["I open many browser tabs and piece it together.","I research first, then ask AI for a summary.","I ask AI for a learning path, examples, challenges, and edge cases."]],["You are starting a new project.",["My first question is: which app should I open?","I begin with familiar tools and add AI where it saves time.","I define the outcome, constraints, risks, and definition of done before choosing tools."]],["A repeatable task is taking too much time.",["I do it faster using the same steps.","I use AI on the slowest step.","I redesign the workflow, including exceptions, and let AI make the first pass."]],["You receive a vague request from a stakeholder.",["I start working and clarify details as I go.","I ask a few questions, then use AI to organize a response.","I create a decision brief: audience, required decision, assumptions, and success criteria."]],["An AI output is almost right.",["I rewrite it myself.","I ask AI to revise it with a new prompt.","I diagnose missing context or criteria, add them, and verify the revised output."]],["You are working with a team.",["We share files and each person works in their own way.","We each use AI for individual tasks.","We share briefs, prompts, quality standards, and review loops so AI work is consistent."]],["Where does your work create the most value?",["In the quality of what I personally produce.","In combining my expertise with useful tools.","In setting direction, applying judgment, and verifying work models execute."]]];
const profiles=[{"title":"Digital Native · The Craftsman","key":"craftsman","copy":"You create directly and own the details. When a brief lands, you usually open the familiar tool, build the work yourself, and improve it through your own sequence of decisions. That gives you a strong quality bar, real context, and the ability to catch nuance others may miss.\n\nAI may already help with proofreading, research, or occasional drafts, but it probably joins after the core work has started. Your next step is not to abandon craft—it is to bring AI in earlier. Give it messy notes, a source pack, or a rough outline and ask for a first structure. Then use your judgment to correct, deepen, and own the final result.\n\nTry this: choose one repeatable task this week and compare your normal approach with an AI-generated first pass."},{"title":"Hybrid Explorer · The Augmented Driver","key":"driver","copy":"You already know where AI adds value. You use it to shorten research, improve wording, generate options, troubleshoot difficult steps, or get unstuck when momentum slows. Your expertise is still firmly in the driver’s seat: you know when an output is useful, when it needs another round, and when it should be ignored.\n\nThe opportunity is to move AI from an add-on inside an existing process to a partner you involve from the beginning. Before your next project, write down the audience, decision required, constraints, risks, and what success must include. Give that brief to AI first, then use its output to choose the right tools and next actions.\n\nTry this: start one project with the outcome and acceptance criteria—not the app you plan to open."},{"title":"AI Native · The Director","key":"director","copy":"You tend to start with the destination: the outcome, the audience, the non-negotiables, and the evidence that will prove the work is finished. Rather than personally producing every intermediate step, you direct models through research, drafting, analysis, critique, and revision—then verify the result with human judgment.\n\nYour strength is not simply writing better prompts. It is designing a system where context, constraints, and quality checks travel with the work. You understand that AI can accelerate execution, but accountability, judgment, and trust remain human responsibilities.\n\nYour next frontier is scale: turn your best methods into reusable briefs, shared review standards, and team workflows so colleagues can get consistent results without relying on one person’s memory."}];
let selectedGuide='',index=0,total=0;document.querySelectorAll('.guide').forEach(x=>x.onclick=()=>{selectedGuide=x.dataset.guide;index=0;total=0;document.querySelector('#guide-screen').classList.add('hidden');document.querySelector('#quiz-screen').classList.remove('hidden');render()});function render(){let [q,answers]=questions[index];counter.textContent='Question '+(index+1)+' of '+questions.length;document.querySelector('#guide-chip').textContent='Guide: '+selectedGuide;bar.style.width=(index/questions.length*100)+'%';question.textContent=q;options.innerHTML='';answers.forEach((answer,score)=>{let b=document.createElement('button');b.className='option';b.innerHTML='<span class="letter">'+ 'ABC'[score]+'</span><span>'+answer+'</span>';b.onclick=()=>choose(score);options.append(b)})}function choose(score){total+=score;if(++index<questions.length)return render();showResult()}function showResult(){document.querySelector('#quiz-screen').classList.add('hidden');document.querySelector('#result-screen').classList.remove('hidden');let p=profiles[total<=7?0:total<=14?1:2],guide=selectedGuide.startsWith('Female')?'female':selectedGuide.startsWith('Male')?'male':'angel';document.querySelector('#result-image').src='result-'+guide+'-'+p.key+'.png';score.textContent='Your pulse score: '+total+' / 20';document.querySelector('#result-title').textContent=p.title;document.querySelector('#result-copy').textContent=p.copy}function caption(){return 'I just took the AI Native Pulse and landed as '+document.querySelector('#result-title').textContent+'. Where does your workflow sit today? Take the 10-question pulse: '+location.href+' #AINative #FutureOfWork'}copy.onclick=async()=>{try{await navigator.clipboard.writeText(caption());copy.textContent='Caption copied!'}catch{prompt('Copy this LinkedIn caption:',caption())}};restart.onclick=()=>{document.querySelector('#result-screen').classList.add('hidden');document.querySelector('#guide-screen').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
