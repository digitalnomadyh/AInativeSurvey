<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Native Pulse</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7ff;color:#172033;font-family:system-ui,sans-serif}.shell{max-width:900px;margin:auto;padding:42px 20px}h1{font-size:clamp(2.4rem,7vw,4.8rem);line-height:1;margin:0}em{font-style:normal;color:#5b4fe9}.intro{font-size:1.1rem;color:#59677c;max-width:650px;line-height:1.5}.card{background:#fff;border:1px solid #dce3ee;border-radius:24px;padding:28px;box-shadow:0 12px 35px #243a6617;margin-top:28px}.guides{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.guide{border:2px solid #dce3ee;border-radius:18px;background:white;overflow:hidden;text-align:left;cursor:pointer;font:inherit;padding:0 0 14px}.guide:hover{border-color:#5b4fe9;transform:translateY(-2px)}.guide img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.guide b,.guide span{display:block;margin:10px 12px 0}.guide span,p{color:#59677c}.hidden{display:none}.top{display:flex;justify-content:space-between;font-weight:700;color:#5b4fe9}.bar{height:9px;background:#e7ebf4;border-radius:10px;margin:17px 0 28px}.bar i{display:block;height:100%;background:#5b4fe9;border-radius:10px}.q{font-size:1.65rem}.option{width:100%;padding:16px;margin-top:10px;border:1px solid #dce3ee;border-radius:14px;background:#fafbff;text-align:left;font:inherit;cursor:pointer}.option:hover{border-color:#5b4fe9;background:#f0efff}.result{text-align:center}.result img{width:250px;max-width:80%;border-radius:22px}.btn{background:#5b4fe9;color:white;border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;margin:5px}.btn.alt{background:white;color:#5b4fe9;border:1px solid #5b4fe9}@media(max-width:600px){.guides{gap:8px}.guide span{font-size:.75rem}.card{padding:20px}}</style><main class="shell"><p><b>AI NATIVE PULSE · 10 QUESTIONS</b></p><h1>Ready to unlock your <em>AI-native edge?</em></h1><p class="intro">A quick, upbeat read on how you bring AI into your work. Pick a guide, follow your instinct, and share your result.</p><section class="card" id="choose"><h2>Choose your quiz guide</h2><p>Pick the character you want beside you. This is your choice—not a guess about you.</p><div class="guides"><button class="guide" onclick="start('Maker')"><img src="craftsman.png" alt="Maker guide"><b>Maker</b><span>Hands-on and precise.</span></button><button class="guide" onclick="start('Navigator')"><img src="augmented.png" alt="Navigator guide"><b>Navigator</b><span>Human judgment, AI boost.</span></button><button class="guide" onclick="start('Conductor')"><img src="director.png" alt="Conductor guide"><b>Conductor</b><span>Outcome-led orchestration.</span></button></div></section><section class="card hidden" id="quiz"><div class="top"><span id="count"></span><span id="guide"></span></div><div class="bar"><i id="bar"></i></div><h2 class="q" id="prompt"></h2><div id="opts"></div></section><section class="card result hidden" id="result"><div id="score"></div><img id="pic" alt="Selected guide"><h2 id="type"></h2><p id="desc"></p><button class="btn" onclick="copy()">Copy LinkedIn caption</button><button class="btn alt" onclick="window.open('https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(location.href))">Share on LinkedIn</button></section></main><script>const data=[['Writing a long message',['Blank page, word by word','Write it then polish with AI','Give AI rough thoughts, goal and audience']],['Starting a slide deck',['Build layouts by hand','Use templates and AI features','Set narrative and evidence first']],['Working with data',['Build formulas myself','Use AI for formula help','Give data and questions to an interpreter']],['Learning something new',['Open tabs and synthesize','Ask AI for a summary','Ask AI to tutor and challenge me']],['Starting a project',['Which app do I open?','Which tool speeds this up?','What outcome and constraints matter?']],['Repeating a task',['Do the steps faster','Use AI on one slow step','Design a workflow and review exceptions']],['Checking AI output',['Rarely use it','Edit for voice and accuracy','Set checks before, then verify']],['Preparing a meeting',['Make notes myself','Ask AI to summarize','Give AI context and decisions needed']],['A new tool appears',['Wait until standard','Try it for an existing task','Test it against a real outcome']],['AI is',['A useful tool','A capable assistant','A flexible team member I direct']]];let n=0,s=0,g='';const pics={Maker:'craftsman.png',Navigator:'augmented.png',Conductor:'director.png'};function start(x){g=x;choose.classList.add('hidden');quiz.classList.remove('hidden');render()}function render(){let q=data[n];count.textContent='Question '+(n+1)+' of 10';guide.textContent='Guide: '+g;bar.style.width=n*10+'%';prompt.textContent=q[0];opts.innerHTML=q[1].map((x,i)=>'<button class="option" onclick="pick('+i+')">'+['A','B','C'][i]+'. '+x+'</button>').join('')}function pick(x){s+=x;n<9?(n++,render()):finish()}function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');pic.src=pics[g];score.textContent='Your pulse score: '+s+' / 20';let t=s<8?'Digital Native · The Craftsman':s<15?'Hybrid Explorer · The Augmented Driver':'AI Native · The Director';type.textContent=t;desc.textContent=s<8?'You create directly and own the detail. AI can be a helpful sidekick for research, polishing, and repetitive work.':s<15?'You blend your expertise with AI to move faster. Your next leap is designing the workflow, not just speeding up a step.':'You start with intent, constraints, and a definition of done. AI handles more execution while you steer and verify.'}function copy(){navigator.clipboard.writeText('I took the AI Native Pulse and landed as '+type.textContent+'. Where does your workflow sit today? '+location.href+' #AINative #FutureOfWork');event.target.textContent='Caption copied!'}</script></html>
