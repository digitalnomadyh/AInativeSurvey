<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Native Pulse</title><style>body{font-family:system-ui;margin:auto;max-width:850px;padding:35px;background:#f5f7ff;color:#172033}h1{font-size:clamp(2.4rem,7vw,4.6rem)}em{color:#5b4fe9}.box{background:#fff;padding:24px;border-radius:22px;border:1px solid #dde3ee}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}button{font:inherit;padding:13px;border-radius:14px;border:1px solid #ccd6e7;background:white;cursor:pointer}.grid button{padding:0 0 12px;overflow:hidden}.grid img,#pic{width:100%;aspect-ratio:1;object-fit:cover;display:block}.hidden{display:none}.opt{display:block;width:100%;text-align:left;margin:9px 0}.top{display:flex;justify-content:space-between;color:#5b4fe9;font-weight:700}.bar{height:8px;background:#e6eaf4;margin:15px 0}.bar i{display:block;height:100%;background:#5b4fe9}.result{text-align:center}#pic{width:260px;margin:auto;border-radius:20px}@media(max-width:600px){.grid{gap:7px}.grid button{font-size:.8rem}}</style><h1>Are you ready to be <em>AI native?</em></h1><p>Choose an avatar. Your answers—not your avatar—will reveal your AI-workflow archetype.</p><section class="box" id="start"><h2>Choose your character</h2><div class="grid"><button onclick="go('Female explorer')"><img src="avatar-female.png">Female explorer</button><button onclick="go('Male explorer')"><img src="avatar-male.png">Male explorer</button><button onclick="go('Angel guide')"><img src="avatar-angel.png">Angel guide</button></div></section><section class="box hidden" id="quiz"><div class="top"><span id="n"></span><span id="g"></span></div><div class="bar"><i id="b"></i></div><h2 id="q"></h2><div id="o"></div></section><section class="box result hidden" id="end"><img id="pic"><h2 id="t"></h2><p id="d"></p><button onclick="copyCaption(this)">Copy LinkedIn caption</button></section><script>let i=0,s=0,a='';let Q=[["You need to write a substantial message or brief.",["I open a blank document and draft it line by line.","I draft it myself, then use AI to tighten or polish it.","I give AI my raw thoughts, audience, and goal, then shape the best draft."]],["You are building a presentation.",["I arrange slides and layouts from scratch.","I start with a template, then use AI on parts of the content.","I define the narrative, evidence, and visual brief before generating a first structure."]],["A spreadsheet contains a surprising trend.",["I work through formulas and filters myself.","I use AI to help with formulas or explain an issue.","I ask AI to investigate hypotheses, surface anomalies, and show its reasoning."]],["You need to learn an unfamiliar topic.",["I search, open tabs, and synthesize notes.","I use an AI summary alongside traditional research.","I ask a model to create a learning path, test my understanding, and expose edge cases."]],["A new project lands on your desk.",["My first thought is: which app do I open?","I open familiar tools, with AI close by.","My first move is to frame the outcome, constraints, risks, and definition of done."]],["A repeatable task is taking too long.",["I get faster at doing the steps.","I use AI to speed up the slowest step.","I redesign the workflow so I review exceptions rather than perform every step."]],["You receive a vague request.",["I begin work and clarify as I go.","I ask a few questions, then start drafting.","I turn ambiguity into a decision brief: goal, audience, trade-offs, and acceptance criteria."]],["An AI output is almost right.",["I rewrite the missing pieces manually.","I ask it to revise wording or format.","I diagnose the missing context, constraints, or evaluation criteria and re-direct it."]],["You are working with a team.",["I share files and coordinate edits in tools.","We use AI to accelerate individual work.","We design shared prompts, standards, and review loops for consistent direction."]],["You think about your value at work.",["The quality of what I personally produce.","How well I combine expertise with useful tools.","How well I set direction, exercise judgment, and verify work performed by people and models."]]];function go(x){a=x;start.classList.add('hidden');quiz.classList.remove('hidden');r()}function r(){n.textContent='Question '+(i+1)+' of 10';g.textContent=a;b.style.width=i*10+'%';q.textContent=Q[i][0];o.innerHTML=Q[i][1].map((x,j)=>'<button class="opt" onclick="p('+j+')"><b>'+['A','B','C'][j]+'. </b>'+x+'</button>').join('')}function p(x){s+=x;i++<9?r():f()}function f(){quiz.classList.add('hidden');end.classList.remove('hidden');let z=s<8?0:s<15?1:2;pic.src={'Female explorer':['result-female-craftsman.png','result-female-driver.png','result-female-director.png'],'Male explorer':['result-male-craftsman.png','result-male-driver.png','result-male-director.png'],'Angel guide':['result-angel-craftsman.png','result-angel-driver.png','result-angel-director.png']}[a][z];t.textContent=['Digital Native · The Craftsman','Hybrid Explorer · The Augmented Driver','AI Native · The Director'][z];d.textContent='Your character transforms based on your answers. '+['Hands-on craft and detail.','Human judgment with an AI boost.','Intent, constraints, and orchestration.'][z]}function copyCaption(btn){let x='I took the AI Native Pulse: '+t.textContent+' '+location.href;navigator.clipboard.writeText(x).then(()=>btn.textContent='Caption copied!').catch(()=>prompt('Copy this caption:',x))}</script>
