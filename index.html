<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Native Pulse</title><style>body{font-family:system-ui;margin:auto;max-width:850px;padding:35px;background:#f5f7ff;color:#172033}h1{font-size:clamp(2.4rem,7vw,4.6rem)}em{color:#5b4fe9}.box{background:#fff;padding:24px;border-radius:22px;border:1px solid #dde3ee}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}button{font:inherit;padding:13px;border-radius:14px;border:1px solid #ccd6e7;background:white;cursor:pointer}.grid button{padding:0 0 12px;overflow:hidden}.grid img,#pic{width:100%;aspect-ratio:1;object-fit:cover;display:block}.hidden{display:none}.opt{display:block;width:100%;text-align:left;margin:9px 0}.top{display:flex;justify-content:space-between;color:#5b4fe9;font-weight:700}.bar{height:8px;background:#e6eaf4;margin:15px 0}.bar i{display:block;height:100%;background:#5b4fe9}.result{text-align:center}#pic{width:260px;margin:auto;border-radius:20px}@media(max-width:600px){.grid{gap:7px}.grid button{font-size:.8rem}}</style><h1>Are you ready to be <em>AI native?</em></h1><p>Choose an avatar. Your answers—not your avatar—will reveal your AI-workflow archetype.</p><section class="box" id="start"><h2>Choose your character</h2><div class="grid"><button onclick="go('Female explorer')"><img src="avatar-female.png">Female explorer</button><button onclick="go('Male explorer')"><img src="avatar-male.png">Male explorer</button><button onclick="go('Angel guide')"><img src="avatar-angel.png">Angel guide</button></div></section><section class="box hidden" id="quiz"><div class="top"><span id="n"></span><span id="g"></span></div><div class="bar"><i id="b"></i></div><h2 id="q"></h2><div id="o"></div></section><section class="box result hidden" id="end"><img id="pic"><h2 id="t"></h2><p id="d"></p><button onclick="navigator.clipboard.writeText('I took the AI Native Pulse: '+t.textContent+' '+location.href)">Copy LinkedIn caption</button></section><script>let i=0,s=0,a='';let Q=['Writing a long message','Starting a slide deck','Working with data','Learning a new idea','Beginning a project','A repetitive task appears','Checking AI output','Preparing a meeting','A new tool launches','AI is best described as'];function go(x){a=x;start.classList.add('hidden');quiz.classList.remove('hidden');r()}function r(){n.textContent='Question '+(i+1)+' of 10';g.textContent=a;b.style.width=i*10+'%';q.textContent=Q[i];o.innerHTML=['A. I start directly in my usual tools','B. I use AI to speed up part of it','C. I set the outcome and direct AI'].map((x,j)=>'<button class="opt" onclick="p('+j+')">'+x+'</button>').join('')}function p(x){s+=x;i++<9?r():f()}function f(){quiz.classList.add('hidden');end.classList.remove('hidden');let z=s<8?0:s<15?1:2;pic.src={'Female explorer':'avatar-female.png','Male explorer':'avatar-male.png','Angel guide':'avatar-angel.png'}[a];t.textContent=['Digital Native · The Craftsman','Hybrid Explorer · The Augmented Driver','AI Native · The Director'][z];d.textContent='Your character transforms based on your answers. '+['Hands-on craft and detail.','Human judgment with an AI boost.','Intent, constraints, and orchestration.'][z]}</script>
